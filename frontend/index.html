<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Громкость</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #101114;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      body {
        overflow: hidden;
        user-select: none;
        scrollbar-width: thin;
        scrollbar-color: #9eb6f0 transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
        margin: 6px 0;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #9eb6f0, #e8a87c);
        border: 2px solid #101114;
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e8a87c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
